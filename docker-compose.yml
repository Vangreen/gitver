services:
  gitver:
    image: ${GITVER_IMAGE:-ghcr.io/vangreen/gitver:latest}
    ports:
      - "${PORT:-8090}:8090"
    environment:
      GITHUB_TOKEN: "${GITHUB_TOKEN:?Set GITHUB_TOKEN in .env}"
      DATA_DIR: /data
    volumes:
      - ./data:/data
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
